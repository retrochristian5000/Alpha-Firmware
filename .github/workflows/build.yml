name: Build Alpha firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out firmware
        uses: actions/checkout@v4

      - name: Install Alpha cross tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            gcc-alpha-linux-gnu binutils-alpha-linux-gnu

      - name: Build Clipper firmware
        run: make CROSS=alpha-linux-gnu-

      - name: Verify firmware image
        run: test -s palcode-clipper
